<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giám sát chất lượng không khí TP.HCM</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --nen:#f5f7fa; --the:#ffffff; --vien:#dde2e8; --chu:#16202b;
    --chu-mo:#5a6470; --chinh:#1f7a8c;
    --tot:#2e8b62; --tb:#c9841b; --xau:#c0483f;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;
       background:var(--nen);color:var(--chu);height:100vh;overflow:hidden}
  #khung{display:flex;height:100vh}
  #ban-do{flex:1;min-width:0}
  /* Chrome ve khung focus quanh ca lop SVG khi bam vao o luoi */
  .leaflet-container svg:focus, .leaflet-interactive:focus{outline:none}
  #canh{width:400px;background:var(--the);border-left:1px solid var(--vien);
        display:flex;flex-direction:column;overflow-y:auto}
  header{padding:16px 18px 12px;border-bottom:1px solid var(--vien)}
  h1{margin:0;font-size:16px;line-height:1.35}
  .phu{color:var(--chu-mo);font-size:12px;margin-top:4px}
  .muc{padding:14px 18px;border-bottom:1px solid var(--vien)}
  .nhan{font-size:11px;text-transform:uppercase;letter-spacing:.06em;
        color:var(--chu-mo);margin-bottom:6px;font-weight:600}
  select,input[type=range]{width:100%}
  select{padding:7px 9px;border:1px solid var(--vien);border-radius:6px;
         background:#fff;font-size:13px;color:var(--chu)}
  .ngay{display:flex;justify-content:space-between;font-size:12px;
        color:var(--chu-mo);margin-top:6px}
  .ngay b{color:var(--chu);font-size:13px}
  .chu-giai{display:flex;gap:4px;margin-top:8px}
  .chu-giai div{flex:1;height:8px;border-radius:2px}
  .o-nho{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .o-nho div{background:var(--nen);border:1px solid var(--vien);border-radius:6px;
             padding:8px;text-align:center}
  .o-nho .n{font-size:10px;color:var(--chu-mo)}
  .o-nho .v{font-size:13px;font-weight:700;margin-top:2px}
  .trong{color:var(--chu-mo);font-size:13px;padding:22px 18px;text-align:center}
  canvas{margin-top:6px}
  .the-canh{border-radius:6px;padding:9px 11px;color:#fff;font-size:13px;
            font-weight:600;margin-top:8px}
  table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px}
  th,td{padding:4px 6px;border-bottom:1px solid var(--vien);text-align:right}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--chu-mo);font-weight:600}
  .info-o{background:var(--nen);border:1px solid var(--vien);border-radius:6px;
          padding:8px 10px;font-size:12px;color:var(--chu-mo)}
  .anh-o{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;
         border:1px solid var(--vien);display:block;background:var(--nen)}
  .nut-kb{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
  .nut-kb button{padding:7px 6px;border:1px solid var(--vien);border-radius:6px;
                 background:#fff;font-size:12px;color:var(--chu);cursor:pointer}
  .nut-kb button.chon{border-color:var(--chinh);background:#e8f3f5;font-weight:600}
  .thanh-kb{margin-top:10px;font-size:12px}
  .thanh-kb label{display:flex;justify-content:space-between;color:var(--chu-mo);margin-top:6px}
  .thanh-kb label b{color:var(--chu)}
  .kq-kb{margin-top:10px;background:var(--nen);border:1px solid var(--vien);
         border-radius:6px;padding:9px 11px;font-size:12.5px;line-height:1.5}
  .kq-kb .so{font-size:18px;font-weight:700}
  .bat-kb{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:8px;color:var(--chu-mo)}
  .bat-kb select{width:auto;padding:3px 6px;font-size:12px}
  @media(max-width:860px){
    #khung{flex-direction:column}
    #canh{width:100%;height:46vh;border-left:none;border-top:1px solid var(--vien)}
    #ban-do{height:54vh}
  }
</style>
</head>
<body>
<div id="khung">
  <div id="ban-do"></div>
  <aside id="canh">
    <header>
      <h1>Giám sát &amp; dự báo chất lượng không khí TP.HCM</h1>
      <div class="phu" id="pham-vi">Đang tải…</div>
    </header>

    <div class="muc">
      <div class="nhan">Chỉ số quan trắc</div>
      <select id="chon-chi-so"></select>
    </div>

    <div class="muc">
      <div class="nhan">Thời gian</div>
      <input type="range" id="thanh-ngay" min="0" max="0" value="0">
      <div class="ngay"><span id="ngay-dau"></span><b id="ngay-hien"></b><span id="ngay-cuoi"></span></div>
      <div class="chu-giai">
        <div style="background:var(--tot)"></div>
        <div style="background:var(--tb)"></div>
        <div style="background:var(--xau)"></div>
      </div>
      <div class="ngay"><span>Tốt</span><span>Trung bình</span><span>Xấu</span></div>
    </div>

    <div class="muc" id="khu-kich-ban">
      <div class="nhan">Kịch bản thời tiết ngày mai</div>
      <div class="nut-kb" id="nut-kb">
        <button data-kb="thuong" class="chon">Bình thường</button>
        <button data-kb="nang">Nắng nóng, lặng gió</button>
        <button data-kb="mua">Mưa lớn</button>
        <button data-kb="gio">Gió mạnh</button>
      </div>
      <div class="thanh-kb">
        <label>Lượng mưa <b id="gt-mua"></b></label>
        <input type="range" id="kb-mua" min="0" max="80" step="1">
        <label>Tốc độ gió <b id="gt-gio"></b></label>
        <input type="range" id="kb-gio" min="0" max="7" step="0.1">
        <label>Nhiệt độ <b id="gt-nhiet"></b></label>
        <input type="range" id="kb-nhiet" min="22" max="33" step="0.1">
      </div>
      <div class="kq-kb" id="kq-kb">Đang tải…</div>
      <div class="bat-kb">
        <input type="checkbox" id="kb-ban-do"><label for="kb-ban-do">Hiện kịch bản trên bản đồ:</label>
        <select id="kb-kieu"><option value="muc">mức cảnh báo</option><option value="doi">mức thay đổi</option></select>
      </div>
    </div>

    <div class="muc" id="khu-chi-tiet">
      <div class="trong">Bấm vào một ô trên bản đồ để xem biểu đồ lịch sử và dự báo.</div>
    </div>
  </aside>
</div>

<script>
const API = "";
let thongTin = null, luoiLayer = null, duLieuNgay = {}, bieuDo = null;
let chiSoHienTai = "no2", danhSachNgay = [], oDangChon = null;
// Kich ban thoi tiet ngay mai (mo hinh src/kich_ban.py)
const kichBan = {ketQua:null, trenBanDo:false, thuong:null};
const MAU_KB = {
  nang:{luong_mua:0, toc_do_gio:0.5, nhiet_do:31},
  mua:{luong_mua:40, toc_do_gio:2.5, nhiet_do:25.5},
  gio:{luong_mua:2, toc_do_gio:5}
};

const map = L.map("ban-do", {zoomControl:true}).setView([10.95, 106.95], 9);
// Nen ban do Esri: tile.openstreetmap.org bi mang chan (reset ket noi), CARTO doi API key
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
  attribution:'Tiles &copy; Esri', maxZoom:18
}).addTo(map);

const fmt = v => {
  if (v === null || v === undefined || !isFinite(v)) return "–";
  const a = Math.abs(v);
  if (a !== 0 && (a < 0.001 || a >= 1e5)) return v.toExponential(2);
  return v.toFixed(a < 1 ? 3 : 2);
};

function mauTheoNguong(v, ng){
  if (v === null || v === undefined || !isFinite(v)) return "#e3e7ec";
  if (!ng) return "#2e8b62";
  if (v < ng.tot_duoi) return "#2e8b62";
  if (v < ng.trung_binh_duoi) return "#c9841b";
  return "#c0483f";
}

async function lay(url){
  const r = await fetch(API + url);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function ngayTuChiSo(i){ return danhSachNgay[i]; }

function chuoiNgay(d){
  const th = String(d.getMonth()+1).padStart(2,"0"), ng = String(d.getDate()).padStart(2,"0");
  return `${d.getFullYear()}-${th}-${ng}`;
}
function lietKeNgay(dau, cuoi){
  const ds = [], d = new Date(dau + "T00:00:00"), het = new Date(cuoi + "T00:00:00");
  while (d <= het){ ds.push(chuoiNgay(d)); d.setDate(d.getDate()+1); }
  return ds;
}

function mauThayDoi(d, thang){
  // xanh = giam, do = tang; thang = chenh lech lon nhat (mau dam nhat)
  if (d === null || d === undefined || !isFinite(d)) return "#e3e7ec";
  const t = Math.max(-1, Math.min(1, d / thang));
  const a = Math.abs(t), tron = (x,y)=>Math.round(x + (y-x)*a);
  return t < 0 ? `rgb(${tron(240,31)},${tron(240,102)},${tron(240,170)})`
               : `rgb(${tron(240,192)},${tron(240,72)},${tron(240,63)})`;
}

function veKichBanLenBanDo(){
  const kb = kichBan.ketQua, ng = thongTin.nguong[chiSoHienTai];
  const kieu = document.getElementById("kb-kieu").value;
  const doi = Object.keys(kb.gia_tri).map(i => kb.gia_tri[i] - kb.binh_thuong[i]);
  const thang = Math.max(...doi.map(Math.abs)) || 1;
  luoiLayer.setStyle(f => {
    const i = f.properties.id_o, v = kb.gia_tri[i];
    const mau = kieu === "doi" ? mauThayDoi(v - kb.binh_thuong[i], thang) : mauTheoNguong(v, ng);
    return {fillColor: mau, fillOpacity: v==null?0.15:0.75, color:"#ffffff", weight:0.5};
  });
  document.getElementById("ngay-hien").textContent = kb.ngay_du_bao + " (kịch bản)";
}

async function veBanDo(ngay){
  if (kichBan.trenBanDo && kichBan.ketQua) return veKichBanLenBanDo();
  const ng = thongTin.nguong[chiSoHienTai];
  let dl;
  const khoa = chiSoHienTai + "|" + ngay;
  if (duLieuNgay[khoa]) dl = duLieuNgay[khoa];
  else {
    try { dl = await lay(`/api/ban-do?chi_so=${chiSoHienTai}&ngay=${ngay}`); }
    catch(e){ dl = {gia_tri:{}}; }
    duLieuNgay[khoa] = dl;
  }
  luoiLayer.setStyle(f => {
    const v = dl.gia_tri[f.properties.id_o];
    return {fillColor: mauTheoNguong(v, ng), fillOpacity: v==null?0.15:0.72,
            color:"#ffffff", weight:0.5};
  });
}

function veBieuDo(ls, db){
  const nhan = ls.ngay.slice(), gt = ls.gia_tri.slice();
  // Duong du bao noi tu gia tri thuc do cuoi cung; diem noi nay khong ve cham
  // de khong bi hieu nham la mot ngay du bao
  const duBao = new Array(gt.length).fill(null);
  const iCuoi = gt.map(v=>v!==null).lastIndexOf(true);
  if (db && iCuoi >= 0) duBao[iCuoi] = gt[iCuoi];
  const banKinh = duBao.map((v,i)=> i===iCuoi ? 0 : 3);
  (db ? db.du_bao : []).forEach(x => { nhan.push(x.ngay); gt.push(null); duBao.push(x.gia_tri); });

  const ctx = document.getElementById("bieu-do").getContext("2d");
  if (bieuDo) bieuDo.destroy();
  bieuDo = new Chart(ctx, {
    type:"line",
    data:{labels:nhan, datasets:[
      {label:"Thực đo", data:gt, borderColor:"#1f7a8c", backgroundColor:"rgba(31,122,140,.10)",
       borderWidth:1.6, pointRadius:0, tension:.25, fill:true, spanGaps:true},
      {label:"Dự báo", data:duBao, borderColor:"#c0483f", borderWidth:2,
       borderDash:[5,3], pointRadius:ctx0=>banKinh[ctx0.dataIndex] ?? 3,
       pointBackgroundColor:"#c0483f", tension:.25, spanGaps:true}
    ]},
    options:{responsive:true, interaction:{mode:"index",intersect:false},
      plugins:{legend:{labels:{boxWidth:10,font:{size:11}}}},
      scales:{x:{ticks:{maxTicksLimit:4,autoSkip:true,maxRotation:0,font:{size:10}}},
              y:{ticks:{font:{size:10},callback:v=>fmt(v)}}}}
  });
}

async function chonO(id_o, ma_o){
  oDangChon = id_o;
  const khu = document.getElementById("khu-chi-tiet");
  khu.innerHTML = '<div class="trong">Đang tải…</div>';
  try{
    const ls = await lay(`/api/lich-su?id_o=${id_o}&chi_so=${chiSoHienTai}&so_ngay=120`);
    let db = null;
    try { db = await lay(`/api/du-bao?id_o=${id_o}&chi_so=${chiSoHienTai}`); } catch(e){}

    const hopLe = ls.gia_tri.filter(v=>v!==null);
    const tb = hopLe.reduce((a,b)=>a+b,0)/(hopLe.length||1);
    const mau = {"Tốt":"var(--tot)","Trung bình":"var(--tb)","Xấu":"var(--xau)"};

    khu.innerHTML = `
      <div class="nhan">Ô lưới ${ma_o}</div>
      <div class="info-o">Đơn vị: ${ls.don_vi} &nbsp;·&nbsp; ${thongTin.kich_thuoc_o_km}×${thongTin.kich_thuoc_o_km} km</div>
      <div class="o-nho">
        <div><div class="n">Mới nhất</div><div class="v">${fmt(hopLe[hopLe.length-1])}</div></div>
        <div><div class="n">TB 120 ngày</div><div class="v">${fmt(tb)}</div></div>
        <div><div class="n">Cao nhất</div><div class="v">${fmt(Math.max(...hopLe))}</div></div>
      </div>
      <canvas id="bieu-do" height="150"></canvas>
      <div class="nhan" style="margin-top:12px">Ảnh vệ tinh màu thật của ô</div>
      <img class="anh-o" src="/static/anh/o_${id_o}.jpg" alt="Ảnh Sentinel-2 ô ${ma_o}"
           onerror="this.parentNode.removeChild(this.nextElementSibling);this.remove()">
      <div class="phu">Sentinel-2 L2A, ảnh ghép trung vị mùa khô 12/2025–3/2026, độ phân giải 10 m</div>
      ${db ? db.du_bao.map(x=>
        `<div class="the-canh" style="background:${mau[x.muc]||'#8a8a8a'}">
           ${x.ngay} (t+${x.tam}) — ${fmt(x.gia_tri)} · ${x.muc}</div>`).join("")
        : '<div class="info-o" style="margin-top:8px">Chỉ số này không có dự báo — chỉ hiển thị bản đồ.</div>'}
    `;
    veBieuDo(ls, db);
    if (kichBan.ketQua) tinhKichBan();
  }catch(e){
    khu.innerHTML = '<div class="trong">Không lấy được dữ liệu cho ô này.</div>';
  }
}

function ghiThanhKb(t){
  const m = document.getElementById("kb-mua"), g = document.getElementById("kb-gio"),
        n = document.getElementById("kb-nhiet");
  if (t.luong_mua !== undefined) m.value = t.luong_mua;
  if (t.toc_do_gio !== undefined) g.value = t.toc_do_gio;
  if (t.nhiet_do !== undefined) n.value = t.nhiet_do;
  document.getElementById("gt-mua").textContent = (+m.value).toFixed(0) + " mm/ngày";
  document.getElementById("gt-gio").textContent = (+g.value).toFixed(1) + " m/s";
  document.getElementById("gt-nhiet").textContent = (+n.value).toFixed(1) + " °C";
}

async function tinhKichBan(){
  const khu = document.getElementById("khu-kich-ban");
  const c = thongTin.chi_so.find(x=>x.ma===chiSoHienTai);
  if (!c || !c.co_du_bao){ khu.style.display = "none"; return; }
  khu.style.display = "";
  // "Binh thuong" -> moi o giu khi hau thang cua rieng no (khong gui tham so)
  const thuong = document.querySelector('#nut-kb button[data-kb="thuong"]').classList.contains("chon");
  const q = thuong ? "" : `luong_mua=${document.getElementById("kb-mua").value}` +
            `&toc_do_gio=${document.getElementById("kb-gio").value}` +
            `&nhiet_do=${document.getElementById("kb-nhiet").value}`;
  let kb;
  try { kb = await lay(`/api/kich-ban?chi_so=${chiSoHienTai}&${q}`); }
  catch(e){ document.getElementById("kq-kb").textContent = "Chưa có mô hình kịch bản."; return; }
  kichBan.ketQua = kb;
  const ng = thongTin.nguong[chiSoHienTai];
  const muc = v => !ng ? "" : v < ng.tot_duoi ? "Tốt" : v < ng.trung_binh_duoi ? "Trung bình" : "Xấu";
  const demXau = o => Object.values(o).filter(v => ng && v >= ng.trung_binh_duoi).length;
  const d = kb.chenh_lech, dau = d > 0 ? "+" : "";
  const bt = kb.thoi_tiet_binh_thuong;
  let dong = `Dự báo ngày <b>${kb.ngay_du_bao}</b>, trung bình ${Object.keys(kb.gia_tri).length} ô:<br>
    <span class="so">${fmt(kb.tb_kich_ban)}</span>
    <span style="color:${d>0?'var(--xau)':d<0?'var(--tot)':'var(--chu-mo)'};font-weight:600">
      (${dau}${fmt(d)}${kb.phan_tram!==null ? `; ${dau}${kb.phan_tram.toFixed(1)}%` : ""})</span>
    so với thời tiết bình thường<br>
    Số ô mức Xấu: <b>${demXau(kb.gia_tri)}</b> (bình thường: ${demXau(kb.binh_thuong)})`;
  if (oDangChon && kb.gia_tri[oDangChon] !== undefined){
    const v = kb.gia_tri[oDangChon], v0 = kb.binh_thuong[oDangChon];
    dong += `<br>Ô đang chọn: <b>${fmt(v)}</b> · ${muc(v)} (bình thường ${fmt(v0)} · ${muc(v0)})`;
  }
  dong += `<div class="phu">Bình thường tháng ${+kb.ngay_du_bao.slice(5,7)}: mưa ${bt.luong_mua.toFixed(0)} mm,
    gió ${bt.toc_do_gio.toFixed(1)} m/s, ${bt.nhiet_do.toFixed(1)} °C · XGBoost có thêm thời tiết ngày dự báo, R² kiểm tra ${kb.r2_test.toFixed(2)}</div>`;
  document.getElementById("kq-kb").innerHTML = dong;
  if (kichBan.trenBanDo) veKichBanLenBanDo();
}
let henKb = null;
function henTinh(){ clearTimeout(henKb); henKb = setTimeout(tinhKichBan, 150); }

async function khoiDongKichBan(){
  const kb = await lay(`/api/kich-ban?chi_so=no2`).catch(()=>null);
  kichBan.thuong = kb ? kb.thoi_tiet_binh_thuong : {luong_mua:10, toc_do_gio:1.7, nhiet_do:26.5};
  ghiThanhKb(kichBan.thuong);
  const nut = [...document.querySelectorAll("#nut-kb button")];
  nut.forEach(b => b.addEventListener("click", ()=>{
    nut.forEach(x=>x.classList.toggle("chon", x===b));
    ghiThanhKb({...kichBan.thuong, ...(MAU_KB[b.dataset.kb]||{})});
    tinhKichBan();
  }));
  ["kb-mua","kb-gio","kb-nhiet"].forEach(id => document.getElementById(id)
    .addEventListener("input", ()=>{ nut.forEach(x=>x.classList.remove("chon")); ghiThanhKb({}); henTinh(); }));
  document.getElementById("kb-ban-do").addEventListener("change", e=>{
    kichBan.trenBanDo = e.target.checked;
    document.getElementById("thanh-ngay").dispatchEvent(new Event("change"));
  });
  document.getElementById("kb-kieu").addEventListener("change", ()=>{
    if (kichBan.trenBanDo) veKichBanLenBanDo();
  });
  await tinhKichBan();
}

async function khoiDong(){
  thongTin = await lay("/api/thong-tin");
  danhSachNgay = lietKeNgay(thongTin.ngay_dau, thongTin.ngay_cuoi);

  document.getElementById("pham-vi").textContent =
    `${thongTin.so_o_luoi} ô lưới ${thongTin.kich_thuoc_o_km}×${thongTin.kich_thuoc_o_km} km · ${thongTin.ngay_dau} → ${thongTin.ngay_cuoi}`;

  const sel = document.getElementById("chon-chi-so");
  sel.innerHTML = thongTin.chi_so.map(c =>
    `<option value="${c.ma}">${c.ma.toUpperCase()} — ${c.ten}${c.co_du_bao?" (có dự báo)":""}</option>`).join("");
  sel.value = chiSoHienTai;

  const gj = await lay("/api/luoi");
  luoiLayer = L.geoJSON(gj, {
    style:{color:"#fff", weight:0.5, fillOpacity:0.7},
    onEachFeature:(f, layer)=>{
      // Toa do bam -> o luoi: hoi PostGIS (ST_Contains) thay vi tu tinh o trinh duyet
      layer.on("click", async e => {
        try {
          const o = await lay(`/api/o-tai-diem?kinh_do=${e.latlng.lng}&vi_do=${e.latlng.lat}`);
          chonO(o.id_o, o.ma_o);
        } catch(_) { chonO(f.properties.id_o, f.properties.ma_o); }
      });
      layer.bindTooltip("Ô " + f.properties.ma_o, {sticky:true});
    }
  }).addTo(map);
  map.invalidateSize();
  map.fitBounds(luoiLayer.getBounds(), {padding:[12,12]});
  window.addEventListener("resize", ()=> map.invalidateSize());

  const thanh = document.getElementById("thanh-ngay");
  // Mo vao ngay moi nhat CO du lieu cua chi so dang chon (S5P tre vai ngay)
  const ngayCuoiCuaChiSo = ()=> {
    const c = thongTin.chi_so.find(x=>x.ma===chiSoHienTai);
    const i = danhSachNgay.indexOf(c ? c.ngay_cuoi : "");
    return i < 0 ? danhSachNgay.length - 1 : i;
  };
  thanh.max = danhSachNgay.length - 1;
  thanh.value = ngayCuoiCuaChiSo();
  document.getElementById("ngay-dau").textContent = thongTin.ngay_dau;
  document.getElementById("ngay-cuoi").textContent = thongTin.ngay_cuoi;

  const capNhat = async ()=>{
    const ngay = ngayTuChiSo(+thanh.value);
    document.getElementById("ngay-hien").textContent = ngay;
    await veBanDo(ngay);
  };
  thanh.addEventListener("input", ()=>{
    document.getElementById("ngay-hien").textContent = ngayTuChiSo(+thanh.value);
  });
  thanh.addEventListener("change", capNhat);
  // keo thanh thoi gian -> quay ve xem so do that
  thanh.addEventListener("input", ()=>{
    if (kichBan.trenBanDo){ kichBan.trenBanDo = false; document.getElementById("kb-ban-do").checked = false; }
  });
  sel.addEventListener("change", async ()=>{
    chiSoHienTai = sel.value;
    if (+thanh.value > ngayCuoiCuaChiSo()) thanh.value = ngayCuoiCuaChiSo();
    await tinhKichBan();
    await capNhat();
    if (oDangChon) chonO(oDangChon,
      (gj.features.find(f=>f.properties.id_o===oDangChon)||{properties:{}}).properties.ma_o || "");
  });

  await khoiDongKichBan();
  await capNhat();
}

khoiDong().catch(e=>{
  document.getElementById("pham-vi").textContent = "Lỗi: " + e.message;
});
</script>
</body>
</html>
